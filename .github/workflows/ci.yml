name: CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']

permissions:
  contents: read

env:
  REGISTRY: harbor.10.0.0.200.nip.io          # dev images
  GHCR_ORG: ghcr.io/andrelair-platform          # prod images (public, durable, off local disk)

jobs:
  # ── L0/L1 gate (every push/PR) ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps   # Nest 12 scaffold peer-dep graph trips npm arborist (edgesOut) without it
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  # ── Schema docs drift-check: the committed ERD must match the TypeORM migrations ──
  # Runs the TypeORM migrations (via `npm run db:migrate`, the standalone runner — no app boot) on an
  # EPHEMERAL Postgres, then reverse-engineers backend/docs/data-model with the digest-pinned tbls and
  # fails if it drifted. Same source of truth as prod (the migrations). "Docs can't lie." Pattern +
  # determinism gotchas: developer-platform/schema-erd-autogenerated (ref impls ktayl-core/claims/underwriting).
  # PINNED: postgres:17.4 (tbls embeds database_version) + x86_64 baseline + tbls digest + explicit flags.
  # public schema; TypeORM's public.migrations table excluded via backend/.tbls.yml.
  schema-erd-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ktayl_iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pw
      DATABASE_NAME: ktayl_iam
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/ktayl_iam?sslmode=disable"
      TBLS_IMAGE: ghcr.io/k1low/tbls@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - name: Run the TypeORM migrations against the ephemeral DB
        run: npm run db:migrate
      - name: ERD drift-check (regenerate from migrations, fail if committed docs are stale)
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            "$TBLS_IMAGE" doc -t mermaid --sort -j "$TBLS_DSN" docs/data-model --force
          if ! git diff --quiet -- docs/data-model; then
            echo "::error::backend/docs/data-model drifted from the TypeORM migrations — regenerate + commit the ERD."
            git --no-pager diff -- docs/data-model | head -80
            exit 1
          fi
          echo "✅ ERD docs are in sync with the migrations"

  # ── Build · scan · sign · SBOM (main only) — both images ────────────────────
  build-and-push:
    needs: [backend, frontend]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # cosign keyless (OIDC)
      packages: write        # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Compute tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          HARBOR_REF="${REGISTRY}/library/ktayl-iam-${{ matrix.app }}:${SHA}"
          GHCR_REF="${GHCR_ORG}/ktayl-iam-${{ matrix.app }}:${SHA}"
          { echo "tags<<EOF"; echo "${HARBOR_REF}"; echo "${GHCR_REF}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${REGISTRY}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${REGISTRY}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      # Stage the CA to a FILE so BuildKit gets the whole multi-line PEM. Both `build-args:`
      # and `secrets:` of build-push-action parse their input LINE-BY-LINE as id=value, so a
      # multi-line secret value collapses to just its first line ('bad end line'). Passing the
      # secret through an env var preserves newlines; `secret-files:` then reads the full file.
      # NB: this only works if the MINICLOUD_CA_CERT org secret is itself stored MULTI-LINE
      # (re-set 2026-09-21 from the raw 13-line PEM via `gh secret set … < ca.crt`; a
      # newline-stripped secret makes every transport yield a one-line, unparseable cert).
      - name: Stage minicloud CA for BuildKit
        env:
          CA: ${{ secrets.MINICLOUD_CA_CERT }}
        run: |
          printf '%s' "$CA" > "${{ runner.temp }}/minicloud-ca.crt"
          echo "staged CA line count: $(wc -l < "${{ runner.temp }}/minicloud-ca.crt")"  # must be >1

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          secret-files: |
            ca_cert=${{ runner.temp }}/minicloud-ca.crt
          # single-line, safe as a build-arg; busts the CA RUN layer each commit (secret
          # content isn't in the mount's cache key, so the CA copy would otherwise stay cached)
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan (Trivy, CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_ref }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign (keyless) + attach SBOM  [ghcr prod image]
        run: |
          cosign sign --yes ${GHCR_ORG}/ktayl-iam-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          syft ${{ steps.meta.outputs.ghcr_ref }} -o cyclonedx-json=sbom-${{ matrix.app }}.json
          cosign attest --yes --predicate sbom-${{ matrix.app }}.json --type cyclonedx \
            ${GHCR_ORG}/ktayl-iam-${{ matrix.app }}@${{ steps.build.outputs.digest }}
