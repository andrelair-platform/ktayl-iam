name: CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']

permissions:
  contents: read

env:
  REGISTRY: harbor.10.0.0.200.nip.io          # dev images
  GHCR_ORG: ghcr.io/andrelair-platform          # prod images (public, durable, off local disk)

jobs:
  # ── L0/L1 gate (every push/PR) ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps   # Nest 12 scaffold peer-dep graph trips npm arborist (edgesOut) without it
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  # ── Build · scan · sign · SBOM (main only) — both images ────────────────────
  build-and-push:
    needs: [backend, frontend]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # cosign keyless (OIDC)
      packages: write        # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Compute tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          HARBOR_REF="${REGISTRY}/library/ktayl-iam-${{ matrix.app }}:${SHA}"
          GHCR_REF="${GHCR_ORG}/ktayl-iam-${{ matrix.app }}:${SHA}"
          { echo "tags<<EOF"; echo "${HARBOR_REF}"; echo "${GHCR_REF}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${REGISTRY}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${REGISTRY}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # CA via a BuildKit secret, NOT build-args: build-args splits a multi-line value on
          # newlines → a multi-line PEM collapses to just its BEGIN line (bad end line). A
          # --mount=type=secret preserves the raw PEM exactly and keeps it out of image history.
          secrets: |
            ca_cert=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan (Trivy, CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_ref }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign (keyless) + attach SBOM  [ghcr prod image]
        run: |
          cosign sign --yes ${GHCR_ORG}/ktayl-iam-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          syft ${{ steps.meta.outputs.ghcr_ref }} -o cyclonedx-json=sbom-${{ matrix.app }}.json
          cosign attest --yes --predicate sbom-${{ matrix.app }}.json --type cyclonedx \
            ${GHCR_ORG}/ktayl-iam-${{ matrix.app }}@${{ steps.build.outputs.digest }}
