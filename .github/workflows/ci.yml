name: CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

# --legacy-peer-deps: the Nest 12 scaffold's peer-dep graph trips an npm arborist bug
# (`edgesOut`) without it; the flag resolves cleanly. Lockfiles are committed → npm ci.
# NOTE (S001 follow-up): add image build+push (Harbor dev / ghcr prod) + cosign keyless +
# SBOM per .claude/rules/ci-registry.md once the GAP wrapper chart lands.
